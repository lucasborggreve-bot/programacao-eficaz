<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get-it</title>
    <link rel="stylesheet" href="{{{{ url_for('static', filename='css/getit.css') }}}}">
    <script src="{{{{ url_for('static', filename='js/getit.js') }}}}" defer></script>
</head>
<body>
    <main class="page-container">
        <header class="site-header">
            <img class="site-logo" src="{{{{ url_for('static', filename='img/logo-getit.png') }}}}" alt="Get-it">
            <p class="site-subtitle">Como o Post-it, mas com outro verbo</p>
        </header>

        <section class="new-note" aria-labelledby="new-note-title">
            <h1 id="new-note-title">Nova nota</h1>
            <form class="note-form" action="/submit" method="POST">
                <div class="form-field">
                    <label for="titulo">Título</label>
                    <input id="titulo" type="text" name="titulo" required maxlength="80" autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="detalhes">Detalhes</label>
                    <textarea id="detalhes" name="detalhes" required maxlength="500" rows="4"></textarea>
                </div>
                <button type="submit">Adicionar nota</button>
            </form>
        </section>
    
        <section class="notes-section" aria-labelledby="notes-title">
            <h2 id="notes-title">Minhas notas</h2>
            <ul class="notes-list">
            {notes}
            </ul>
        </section>
    </main>

</body>
</html>
